<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>YouTube Downloader - Workspace</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="workspace">
        <aside class="panel rail">
            <div class="rail-item active" onclick="switchView('main')"><i class="fas fa-terminal"></i></div>
            <div class="rail-item" onclick="switchView('files')"><i class="fas fa-folder-tree"></i></div>
            <div class="rail-item" onclick="switchView('config')"><i class="fas fa-sliders"></i></div>
        </aside>

        <section class="panel" style="grid-column: 2;">
            <div class="panel-header">
                <h3>PRIMARY CONSOLE</h3>
                <div><span class="led led-on"></span> SYSTEM ACTIVE</div>
            </div>
            <div class="main-content">
                <div class="command-bar">
                    <input type="text" id="urlInput" class="input-dense" placeholder="Paste YouTube or Instagram Reel URL...">
                    <button id="getInfoBtn" class="btn-dense">ANALYZE</button>
                </div>

                <div id="videoMetaArea" class="hidden">
                    <div class="info-grid">
                        <div class="meta-card">
                            <img id="thumbImg" src="">
                            <h4 id="vidTitle" style="font-size: 14px; margin-bottom: 5px;">Title</h4>
                            <p id="vidAuthor" style="color: var(--text-dim); font-size: 11px;">Author</p>
                            <hr style="border: none; border-top: 1px solid var(--border); margin: 10px 0;">
                            <div class="type-tabs" style="display: flex; gap: 5px;">
                                <button onclick="setType('audio')" id="t-audio" class="btn-dense" style="flex:1; padding: 5px; font-size: 10px;">AUDIO</button>
                                <button onclick="setType('video')" id="t-video" class="btn-dense" style="flex:1; padding: 5px; font-size: 10px; background: var(--bg-inner); border: 1px solid var(--border);">VIDEO</button>
                            </div>
                        </div>
                        <div class="meta-card">
                            <table class="tech-table">
                                <thead><tr><th>EXT</th><th>RES</th><th>CODEC</th><th>SIZE</th></tr></thead>
                                <tbody id="formatTable"></tbody>
                            </table>
                            <div style="margin-top: 15px; display: flex; flex-direction: column; gap: 10px;">
                                <div id="videoOptions" class="hidden" style="display: flex; gap: 10px; width: 100%;">
                                    <select id="resSelect" class="input-dense" style="padding: 5px; flex: 1;"></select>
                                </div>
                                <div id="audioOptions" style="display: flex; gap: 10px; width: 100%;">
                                    <select id="audioFormat" class="input-dense" style="padding: 5px; flex: 1;">
                                        <option value="mp3">MP3</option>
                                        <option value="m4a">M4A</option>
                                        <option value="wav">WAV</option>
                                        <option value="flac">FLAC</option>
                                    </select>
                                    <select id="audioQuality" class="input-dense" style="padding: 5px; flex: 1;">
                                        <option value="320">320K</option>
                                        <option value="256">256K</option>
                                        <option value="192" selected>192K</option>
                                        <option value="128">128K</option>
                                    </select>
                                </div>
                                <button id="dlBtn" class="btn-dense" style="background: #00ff88; color: #000; width: 100%; height: 35px;">DOWNLOAD</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="fileView" class="hidden">
                    <table class="tech-table">
                        <thead><tr><th>FILE NAME</th><th>SIZE</th><th>DATE</th></tr></thead>
                        <tbody id="fileTable"></tbody>
                    </table>
                </div>

                <div id="configView" class="hidden">
                    <div class="meta-card">
                        <h4 style="margin-bottom: 15px;">SYSTEM CONFIGURATION</h4>
                        <div style="display: flex; flex-direction: column; gap: 15px;">
                            <div class="config-item">
                                <label style="display: block; font-size: 11px; color: var(--text-dim); margin-bottom: 5px;">COOKIE SOURCE (FOR PROTECTED CONTENT)</label>
                                <select id="cookieBrowser" class="input-dense" style="width: 100%;">
                                    <option value="none">None (Public Only)</option>
                                    <option value="chrome">Google Chrome</option>
                                    <option value="edge">Microsoft Edge</option>
                                    <option value="firefox">Mozilla Firefox</option>
                                    <option value="opera">Opera</option>
                                </select>
                                <p style="font-size: 10px; color: var(--text-dim); margin-top: 5px;">If Instagram/YouTube fails, select the browser where you are logged in.</p>
                            </div>
                            <div class="config-item">
                                <label style="display: block; font-size: 11px; color: var(--text-dim); margin-bottom: 5px;">WHATSAPP COMPATIBILITY</label>
                                <div style="color: #00ff88; font-size: 11px;"><i class="fas fa-check-circle"></i> Enforced (H.264 + AAC)</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <aside class="utility-pane">
            <div class="sub-panel">
                <div class="panel-header"><h3>ACTIVE QUEUE</h3></div>
                <div id="queueList" style="padding: 10px;"></div>
            </div>
            <div class="sub-panel" style="height: 250px; flex: none;">
                <div class="panel-header"><h3>TERMINAL LOG</h3></div>
                <div id="logTerm" class="terminal"></div>
            </div>
        </aside>
    </div>

    <script>
        let mode = 'audio';
        function log(msg, type='') {
            const l = document.getElementById('logTerm');
            l.innerHTML += `<div class="terminal-line ${type}">[${new Date().toLocaleTimeString()}] ${msg}</div>`;
            l.scrollTop = l.scrollHeight;
        }

        function setType(t) {
            mode = t;
            document.getElementById('t-audio').style.background = t === 'audio' ? 'var(--primary)' : 'var(--bg-inner)';
            document.getElementById('t-video').style.background = t === 'video' ? 'var(--primary)' : 'var(--bg-inner)';
            
            if(t === 'audio') {
                document.getElementById('audioOptions').classList.remove('hidden');
                document.getElementById('videoOptions').classList.add('hidden');
                document.getElementById('videoOptions').style.display = 'none';
                document.getElementById('audioOptions').style.display = 'flex';
            } else {
                document.getElementById('audioOptions').classList.add('hidden');
                document.getElementById('videoOptions').classList.remove('hidden');
                document.getElementById('audioOptions').style.display = 'none';
                document.getElementById('videoOptions').style.display = 'flex';
            }
        }

        async function getInfo() {
            const url = document.getElementById('urlInput').value;
            const browser = document.getElementById('cookieBrowser').value;
            if(!url) return;
            log(`Analyzing: ${url}`, 'cmd');
            const res = await fetch('/api/info', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({url, browser})
            });
            const data = await res.json();
            if(data.success) {
                document.getElementById('vidTitle').innerText = data.title;
                document.getElementById('vidAuthor').innerText = data.author;
                document.getElementById('thumbImg').src = data.thumbnail;
                document.getElementById('formatTable').innerHTML = data.formats_table.map(f => `
                    <tr><td>${f.ext}</td><td>${f.res}</td><td>${f.vcodec || f.acodec}</td><td>${f.filesize ? (f.filesize/(1024*1024)).toFixed(1)+'M' : '-'}</td></tr>
                `).join('');
                const rs = document.getElementById('resSelect');
                rs.innerHTML = data.available_resolutions.map(r => `<option value="${r}">${r}</option>`).join('');
                
                // Show main view if we were in config
                switchView('main');
                document.getElementById('videoMetaArea').classList.remove('hidden');
                log(`Metadata received [${data.platform}]: ${data.title}`);
            } else {
                log(`Error: ${data.error}`, 'error');
            }
        }

        async function startDL() {
            const url = document.getElementById('urlInput').value;
            const q = document.getElementById('queueList');
            const id = 'q-' + Date.now();
            q.innerHTML += `<div id="${id}" class="queue-item">${url.substring(0,30)}...<div class="progress-mini"><div class="progress-fill" style="width:20%"></div></div></div>`;
            log(`Starting download: ${url}`, 'cmd');
            
            const payload = {
                url, 
                type: mode,
                browser: document.getElementById('cookieBrowser').value
            };

            if (mode === 'video') {
                payload.resolution = document.getElementById('resSelect').value;
            } else {
                payload.format = document.getElementById('audioFormat').value;
                payload.quality = document.getElementById('audioQuality').value;
            }
            
            const res = await fetch('/api/download', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if(data.success) {
                document.getElementById(id).querySelector('.progress-fill').style.width = '100%';
                log(`Completed: ${data.filename}`);
                setTimeout(() => window.location.href = data.download_url, 1000);
            }
        }

        function switchView(v) {
            document.getElementById('videoMetaArea').classList.add('hidden');
            document.getElementById('fileView').classList.add('hidden');
            document.getElementById('configView').classList.add('hidden');
            
            document.querySelectorAll('.rail-item').forEach(i => i.classList.remove('active'));
            
            if(v === 'files') {
                document.getElementById('fileView').classList.remove('hidden');
                document.querySelector('[onclick="switchView(\'files\')"]').classList.add('active');
                refreshFiles();
            } else if(v === 'config') {
                document.getElementById('configView').classList.remove('hidden');
                document.querySelector('[onclick="switchView(\'config\')"]').classList.add('active');
            } else {
                document.getElementById('videoMetaArea').classList.remove('hidden');
                document.querySelector('[onclick="switchView(\'main\')"]').classList.add('active');
            }
        }

        async function refreshFiles() {
            const res = await fetch('/api/files');
            const data = await res.json();
            document.getElementById('fileTable').innerHTML = data.map(f => `
                <tr><td>${f.name}</td><td>${f.size}</td><td>${f.time}</td></tr>
            `).join('');
        }

        document.getElementById('getInfoBtn').onclick = getInfo;
        document.getElementById('dlBtn').onclick = startDL;
        log('Workspace initialized. Waiting for input...');
    </script>
</body>
</html>
